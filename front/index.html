<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nutri_DB - Gestão de Pacientes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🍏 Nutri_DB</h1>
    <p>Gestão de pacientes e cálculo de IMC</p>
  </header>

  <main>
    <!-- Formulário de cadastro / edição -->
    <section class="card">
      <h2 id="form-title">Cadastrar Paciente</h2>
      <form id="paciente-form">
        <input type="hidden" id="paciente-id" />

        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Ex: Jason Carvalho" required />

        <label for="idade">Idade</label>
        <input type="number" id="idade" min="0" placeholder="Ex: 28" required />

        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" step="0.01" min="0.1" placeholder="Ex: 1.75" required />

        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" step="0.01" min="0.1" placeholder="Ex: 82.5" required />

        <div class="botoes">
          <button type="submit" id="btn-salvar">Salvar</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
        </div>
      </form>
      <p id="mensagem" class="mensagem" hidden></p>
    </section>

    <!-- Lista de pacientes -->
    <section class="card">
      <div class="card-header">
        <h2>Pacientes Cadastrados</h2>
        <button id="btn-atualizar" class="secundario">🔄 Atualizar</button>
      </div>
      <div id="loading" class="loading" hidden>Carregando...</div>
      <table id="tabela-pacientes">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Altura</th>
            <th>Peso</th>
            <th>IMC</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="sem-registros" class="vazio" hidden>Nenhum paciente cadastrado ainda.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
