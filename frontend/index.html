<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nutri_DB · Controle de Pacientes</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>Nutri_DB</h1>
    <p>Um jeito simples de acompanhar seus pacientes e o IMC de cada um.</p>
  </header>

  <main>
    
    <section class="card">
      <h2 id="form-title">Novo paciente</h2>

      <form id="paciente-form">
        <input type="hidden" id="paciente-id" />

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Ex.: Jason Carvalho" required />

        <label for="idade">Idade</label>
        <input type="number" id="idade" min="0" placeholder="Ex.: 28" required />

        <label for="altura">Altura (em metros)</label>
        <input type="number" id="altura" step="0.01" min="0.1" placeholder="Ex.: 1.75" required />

        <label for="peso">Peso (em kg)</label>
        <input type="number" id="peso" step="0.01" min="0.1" placeholder="Ex.: 82.5" required />

        <div class="botoes">
          <button type="submit" id="btn-salvar">Salvar</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
        </div>
      </form>

      <p id="mensagem" class="mensagem" hidden></p>
    </section>

 
    <section class="card">
      <div class="card-header">
        <h2>Pacientes</h2>
        <button id="btn-atualizar" class="secundario">Recarregar lista</button>
      </div>

      <div id="loading" class="loading" hidden>Buscando os dados...</div>

      <table id="tabela-pacientes">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Altura</th>
            <th>Peso</th>
            <th>IMC</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p id="sem-registros" class="vazio" hidden>Ainda não há ninguém por aqui. Cadastre o primeiro paciente acima.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
